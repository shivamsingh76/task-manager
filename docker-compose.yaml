services:

  postgres-db:

    image: postgres:17

    container_name: postgres-db

    restart: always

    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}

    ports:
      - "${DB_PORT}:5432"

    networks:
      - task-manager-network

    volumes:
      - postgres-data:/var/lib/postgresql/data

    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  task-manager-service:

    image: task-manager:v1.1

    container_name: task-manager-service

    depends_on:
      postgres-db:
        condition: service_healthy

    environment:

      DB_HOST: postgres-db
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}

    ports:
      - "8080:8080"

    networks:
      - task-manager-network

  task-manager-ui:

    image: task-manager-ui:v1.2

    container_name: task-manager-ui

    depends_on:
      - task-manager-service

    ports:
      - "4200:80"

    networks:
      - task-manager-network

volumes:

  postgres-data:

networks:

  task-manager-network:

    name: task-manager-network

    driver: bridge